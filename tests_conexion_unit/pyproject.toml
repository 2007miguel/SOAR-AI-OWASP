[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tests-conexion"
version = "0.1.0"
description = "Integration tests for the engine <-> coordinator connection layer"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["engine", "coordinator"]
